# Template for configs/minstrel_secrets.yaml (gitignored). Placeholders only.
#   cp minstrel_secrets.example.yaml minstrel_secrets.yaml && chmod 600 minstrel_secrets.yaml
# Environment values EMBERDECK_PLEX_USERNAME/PASSWORD (and _URL/_TOKEN) take
# precedence over this file and are never written into it.
version: 1

# Written by you; Minstrel never rewrites this section.
credentials:
  username: YOUR_PLEX_USERNAME
  password: YOUR_PLEX_PASSWORD

# Written by Minstrel after each successful account login (atomic, mode 0600).
# Leave empty; a rejected token here is replaced automatically.
cache:
  url: null
  token: null
