# Aurora owns colour policy. Pawprint controls are read live.
# `value` and `alpha` are intentionally retired: brightness is the one master
# LED brightness control, supplied by Pawprint.
proc_name: aurora
dynamicColour: true
scheme: analogous
static_base_saturation: 0.85
# UI colour is intentionally calmer than the RGBW visualiser. A saturation
# control near 0.9 therefore gives the display roughly a 0.4-equivalent tint.
ui_saturation_scale: 0.45
fallback_hue: 0.0
update_hz: 10.0
album_timeout_s: 2.0

# If Plex UltraBlur is absent, or a generic MPRIS app has artwork, Aurora
# generates a four-corner palette from the published 48x48 album art.
generated_palette_enabled: true
