# Aurora owns colour policy. Pawprint controls are read live.
# `value` and `alpha` are intentionally retired: brightness is the one master
# LED brightness control, supplied by Pawprint.
proc_name: aurora
dynamicColour: true
scheme: analogous
static_base_saturation: 0.85
# UI colour is intentionally calmer than the RGBW visualiser. A saturation
# control near 0.9 therefore gives the display roughly a 0.4-equivalent tint.
ui_saturation_scale: 0.45
fallback_hue: 0.0
update_hz: 10.0
album_timeout_s: 2.0

# Plex uses its UltraBlur palette when available, then falls back to dominant,
# accent, dark and light colours extracted from the published 48x48 artwork.
# MPRIS/local media uses the artwork path directly.
generated_palette_enabled: true

# Output-safe palette policy, shared by extracted artwork and Plex UltraBlur.
# Exact black stays neutral rather than borrowing a misleading hue. Near-black
# and dark grayscale colours borrow the strongest artwork hue; pale grayscale
# is preserved for useful white peaks.
palette_near_black_value: 0.05
palette_near_black_saturation: 0.78
palette_grayscale_saturation: 0.12
palette_pale_grayscale_value: 0.60
palette_pure_black_gray_value: 0.035

# Role order is dominant, accent, dark, light.
palette_dominant_min_saturation: 0.55
palette_dominant_min_value: 0.28
palette_accent_min_saturation: 0.65
palette_accent_min_value: 0.48
palette_dark_min_saturation: 0.70
palette_dark_min_value: 0.10
palette_light_min_saturation: 0.30
palette_light_min_value: 0.75
