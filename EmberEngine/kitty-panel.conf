# kitty settings for the Ember Deck panel UI.
#
# Part of the Ember Deck code, not a user setting: launch_ember_ui.sh passes
# this file to kitty instead of ~/.config/kitty/kitty.conf, so a personal
# kitty setup never changes the panel. The font family and size are taken
# from the emberdeck LXTerminal profile when it exists (panel_terminal.py)
# and override the defaults below.

font_family              monospace
font_size                10

# A bare full-screen panel: no title bar, no padding, no prompts or bells.
hide_window_decorations  yes
window_padding_width     0
placement_strategy       top-left
remember_window_size     no
confirm_os_window_close  0
enable_audio_bell        no
visual_bell_duration     0
cursor_blink_interval    0
mouse_hide_wait          0.5

# The UI owns the whole screen and redraws itself; nothing scrolls.
scrollback_lines         0
shell_integration        disabled
allow_remote_control     no
update_check_interval    0

# Matches the UI's own background so nothing flashes before Textual draws.
background               #090204
foreground               #e8c9a4

linux_display_server     wayland
sync_to_monitor          yes
